name: Build SignalForensics EXE

on:
  workflow_dispatch:

env:
  # Pinned upstream commit
  SIGNAL_FORENSICS_REF: 6d8c36ee4f317403d33c2d0357fcbcf7ee28d710
  PYTHON_VERSION: "3.11"
  RELEASE_TAG: latest

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout SignalForensics
        uses: actions/checkout@v4
        with:
          repository: labcif/SignalForensics
          ref: ${{ env.SIGNAL_FORENSICS_REF }}
          path: SignalForensics

      - name: Verify pinned commit
        shell: bash
        working-directory: SignalForensics
        run: |
          HEAD="$(git rev-parse HEAD)"
          echo "Checked out: $HEAD"
          if [ "$HEAD" != "$SIGNAL_FORENSICS_REF" ]; then
            echo "::error::Expected commit $SIGNAL_FORENSICS_REF but got $HEAD"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install project dependencies
        working-directory: SignalForensics
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi
          poetry run pip install pyinstaller

      - name: Build Windows EXE
        working-directory: SignalForensics
        shell: pwsh
        run: |
          $extraArgs = @()
          if (Test-Path "templates") {
            $extraArgs += "--add-data=templates;templates"
          }
          if (Test-Path "images") {
            $extraArgs += "--add-data=images;images"
          }

          poetry run pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name SignalForensics `
            --collect-all sqlcipher3 `
            --collect-all cryptography `
            --collect-submodules modules `
            --hidden-import sqlcipher3 `
            --hidden-import win32crypt `
            --hidden-import win32api `
            --hidden-import pywintypes `
            --hidden-import pythoncom `
            @extraArgs `
            decrypt_signal.py

          if (-not (Test-Path "dist\SignalForensics.exe")) {
            throw "EXE was not produced at dist\SignalForensics.exe"
          }

          Get-Item "dist\SignalForensics.exe" | Format-List Name, Length, LastWriteTime

      - name: Smoke-test EXE
        working-directory: SignalForensics
        shell: pwsh
        run: |
          .\dist\SignalForensics.exe --help
          .\dist\SignalForensics.exe --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalForensics-windows
          path: SignalForensics/dist/SignalForensics.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SignalForensics
          body: |
            Windows executable build of [labcif/SignalForensics](https://github.com/labcif/SignalForensics).

            **Upstream commit:** [`${{ env.SIGNAL_FORENSICS_REF }}`](https://github.com/labcif/SignalForensics/commit/${{ env.SIGNAL_FORENSICS_REF }})

            ### Usage
            ```
            SignalForensics.exe -h
            ```
          files: SignalForensics/dist/SignalForensics.exe
          fail_on_unmatched_files: true
          make_latest: true
